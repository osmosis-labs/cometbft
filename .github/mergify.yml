queue_rules:
  - name: default
    queue_conditions:
      - base=main
      - label=automerge
    merge_conditions:
      - base=main
      - label=automerge
    merge_method: squash
    commit_message_template: |
      {{ title }} (#{{ number }})

      {{ body }}

pull_request_rules:
  - name: backport patches to v0.37.x branch
    conditions:
      - base=main
      - label=backport-to-v0.37.x
    actions:
      backport:
        branches:
          - v0.37.x
  - name: backport patches to v0.34.x branch
    conditions:
      - base=main
      - label=backport-to-v0.34.x
    actions:
      backport:
        branches:
          - v0.34.x
  - name: refactored queue action rule
    conditions: []
    actions:
      queue:
